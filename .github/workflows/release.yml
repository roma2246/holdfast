name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser строит changelog по истории git
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Токен с правом записи в репозиторий homebrew-tap
          # (секрет репозитория HOMEBREW). Нет секрета — релиз выйдет без cask.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW }}
