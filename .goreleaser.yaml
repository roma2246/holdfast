# Documentation: https://goreleaser.com
version: 2

project_name: holdfast

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/holdfast
    binary: holdfast
    env:
      - CGO_ENABLED=0 # a static binary without dependencies
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, README.ru.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

homebrew_casks:
  - name: holdfast
    repository:
      owner: roma2246
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/roma2246/holdfast
    description: Restore points and guardrails for AI coding agents
    license: MIT
    # Without the tap repository token (the repository secret HOMEBREW) the cask
    # is not published, but the release goes through; pre-releases never reach the tap.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
